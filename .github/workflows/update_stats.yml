name: Update README stats

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore streak (if within 48hr window)
        run: python scripts/restore_streak.py --smart --yes
        continue-on-error: true

      - name: Run stats updater
        run: python scripts/update_stats.py

      - name: Format README (Prettier)
        run: |
          npx prettier --write README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md config/grind.json .cph/ LeetCode_*.py GeeksForGeeks_*.py HackerRank_*.py Codeforces_*.py 2>/dev/null || true

          # Check if README or grind.json have actual changes after stats update
          if git diff --cached --quiet; then
            echo "✅ No changes to commit - stats already up to date"
            exit 0
          fi

          echo "📝 Committing updated stats and configuration"
          git commit -m "chore: auto-update stats and configuration"
          git push
