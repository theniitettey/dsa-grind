name: Update README stats

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 1 * * *" # 1 AM UTC
    - cron: "0 13 * * *" # 1 PM UTC

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore streak (if within 48hr window)
        run: python scripts/restore_streak.py --smart --yes
        continue-on-error: true

      - name: Run stats updater
        run: python scripts/update_stats.py

      - name: Format README (Prettier)
        run: npx prettier --write README.md

      - name: Commit and push if changed
        run: |
          # Check BEFORE staging - this is the key difference!
          if git diff --quiet; then
            echo "✅ No changes to commit - stats already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the main files that always change
          git add README.md config/grind.json

          # Add optional files if they exist (don't fail if they don't)
          git add .cph/ 2>/dev/null || true
          git add LeetCode_*.py 2>/dev/null || true
          git add GeeksForGeeks_*.py 2>/dev/null || true
          git add HackerRank_*.py 2>/dev/null || true
          git add Codeforces_*.py 2>/dev/null || true

          echo "📝 Committing updated stats and configuration"
          git commit -m "chore: auto-update stats and configuration"
          git push
